server {
    listen 80;
    server_name vehrs.lhei.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;  # Ensure this points to Certbot's challenge folder
    }

    location / {
         # Redirect all HTTP traffic to HTTPs
    }
}

server {
    listen 443 ssl;
    server_name vehrs.lhei.org;

    ssl_certificate /etc/letsencrypt/live/vehrs.lhei.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vehrs.lhei.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://frontend:3000;  # Update to port 3000
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 404 /index.html;
    location = / {
        root /usr/share/nginx/html;
        internal;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
